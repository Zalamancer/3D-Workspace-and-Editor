
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              glass: {
                100: 'rgba(255, 255, 255, 0.05)',
                200: 'rgba(255, 255, 255, 0.1)',
                300: 'rgba(255, 255, 255, 0.2)',
                900: 'rgba(0, 0, 0, 0.8)',
              },
              spline: {
                bg: '#09090b',
                panel: '#121212',
                surface: '#1c1c1c',
                border: '#27272a', // zinc-800
                text: '#a1a1aa', // zinc-400
                textLight: '#e4e4e7', // zinc-200
                blue: '#3b82f6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            fontSize: {
              'xxs': '10px',
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        background-color: #09090b;
        overflow: hidden;
        color: #e4e4e7;
        font-family: 'Inter', sans-serif;
        user-select: none;
      }
      /* Custom scrollbar to match Spline */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.4.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "three": "https://esm.sh/three@^0.182.0",
    "zustand": "https://esm.sh/zustand@^5.0.9"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
